name: Global Language Percentages
on:
  schedule:
    - cron: '0 0 * * *' # Updates every night
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Global Language Aggregator
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }} # Uses your account-wide PAT
          GITHUB_USERNAME: "aaelony"
        run: |
          python - <<'EOF'
          import os
          import requests

          token = os.getenv("METRICS_TOKEN")
          username = os.getenv("GITHUB_USERNAME")
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}

          # 1. Fetch ALL repositories you own (public and private)
          repos = []
          page = 1
          while True:
              url = f"https://github.com{page}&type=owner"
              response = requests.get(url, headers=headers).json()
              if not response or "message" in response:
                  break
              repos.extend(response)
              page += 1

          # 2. Accumulate language bytes across all fetched repos
          global_languages = {}
          for repo in repos:
              lang_url = repo["languages_url"]
              lang_data = requests.get(lang_url, headers=headers).json()
              for lang, bytes_count in lang_data.items():
                  global_languages[lang] = global_languages.get(lang, 0) + bytes_count

          # 3. Calculate percentages
          total_bytes = sum(global_languages.values())
          if total_bytes == 0:
              print("No language data found.")
              exit(1)

          sorted_langs = sorted(global_languages.items(), key=lambda x: x[1], reverse=True)

          # 4. Generate Markdown table string
          markdown_output = "## Languages I use by percentage:\n\n"
          markdown_output += "| Language | Percentage | Total Bytes |\n"
          markdown_output += "| :--- | :---: | :--- |\n"
          for lang, bytes_count in sorted_langs:
              pct = (bytes_count / total_bytes) * 100
              markdown_output += f"| **{lang}** | {pct:.2f}% | {bytes_count:,} bytes |\n"

          # 5. Read existing README, replace the target section, and write it back
          readme_path = "README.md"
          with open(readme_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Use marker comments to dynamically update just the stats section
          start_marker = "<!-- START_LANG_STATS -->"
          end_marker = "<!-- END_LANG_STATS -->"
          
          if start_marker in content and end_marker in content:
              before = content.split(start_marker)[0]
              after = content.split(end_marker)[1]
              new_content = f"{before}{start_marker}\n{markdown_output}\n{end_marker}{after}"
          else:
              # Fallback if markers aren't there yet
              new_content = content + f"\n\n{start_marker}\n{markdown_output}\n{end_marker}"

          with open(readme_path, "w", encoding="utf-8") as f:
              f.write(new_content)
          EOF

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff-index --quiet HEAD || git commit -m "Update account-wide language statistics"
          git push
