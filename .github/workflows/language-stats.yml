name: GitHub Language Analytics
on:
  schedule:
    - cron: '0 0 * * *' # Runs every midnight
  workflow_dispatch: # Allows you to press "Run Workflow" manually

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write # CRITICAL: Gives the action permission to save the image to your repo
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Language Charts
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Built-in default token (No custom secrets needed)
          base: "" 
          plugin_languages: yes
          plugin_languages_details: percentage
