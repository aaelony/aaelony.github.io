name: GitHub Language Analytics
on:
  schedule:
    - cron: '0 0 * * *' # Updates automatically every day at midnight
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Global Language Charts
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }} # Your account-wide Personal Access Token
          user: aaelony
          template: classic
          
          # --- THE CRITICAL GLOBAL METRIC SWITCHES ---
          base: "" # Turns off generic profile intro cards
          base_indepth: yes # FORCE ENGINE TO CALCULATE DATA ACROSS ALL ACCOUNT REPOSITORIES
          repositories_affiliations: owner # Targets repositories you explicitly own
          
          # --- LANGUAGES PLUGIN ---
          plugin_languages: yes
          plugin_languages_details: percentage # Outputs precise percent values
          plugin_languages_sections: most-used

