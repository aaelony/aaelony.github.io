name: GitHub Language Analytics
on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Language Charts
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }} # Your token that can read private repos
          base: "" # Disables standard stats
          plugin_languages: yes
          plugin_languages_ignored: html, css # Optional: clean up your chart
          plugin_languages_details: percentage # Shows exact percent numbers
