name: Global Language Percentages
on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs every night
  workflow_dispatch: # Allows manual button trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Calculate and Update Stats
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          import requests

          token = os.getenv("METRICS_TOKEN")
          headers = {"Authorization": f"token {token}", "Accept": "application/vnd.github.v3+json"}

          # 1. Fetch all repositories owned by the user (both public and private)
          repos = []
          page = 1
          while True:
              url = f"https://github.com{page}&type=owner"
              res = requests.get(url, headers=headers).json()
              if not res or "message" in res or len(res) == 0:
                  break
              repos.extend(res)
              page += 1

          # 2. Extract and sum language bytes from the distinct languages endpoint
          global_languages = {}
          for repo in repos:
              lang_url = repo.get("languages_url")
              if lang_url:
                  lang_data = requests.get(lang_url, headers=headers).json()
                  if isinstance(lang_data, dict):
                      for lang, bytes_count in lang_data.items():
                          global_languages[lang] = global_languages.get(lang, 0) + bytes_count

          # 3. Format and Compile a Fresh Markdown Document
          total_bytes = sum(global_languages.values())
          if total_bytes > 0:
              # Sort using index [1] to sort strictly by the calculated byte integer
              sorted_langs = sorted(global_languages.items(), key=lambda x: x[1], reverse=True)
              
              new_readme = "# My Profile\n\n"
              new_readme += "Languages I use by percentage:\n\n"
              new_readme += "| Language | Percentage |\n| :--- | :---: |\n"
              
              for lang, bytes_count in sorted_langs:
                  pct = (bytes_count / total_bytes) * 100
                  new_readme += f"| **{lang}** | {pct:.2f}% |\n"
              
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_readme)
              print("README generated and verified successfully.")
          else:
              print("Critical Error: No data fetched from token profile.")
          EOF

      - name: Commit and Push Data Back to Profile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Automated account-wide language metrics calculation" || exit 0
          git push origin main

