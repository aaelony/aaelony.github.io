name: GitHub Language Analytics
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Global Language Charts
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }} # Your account-wide PAT
          
          # --- THE FIX: Erase 'base: ""' and target your entire user account ---
          user: aaelony
          template: classic
          base: header # Tells it to pull global account metadata instead of local repo data
          
          # --- LANG OPTIONS ---
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          repositories_affiliations: owner, collaborator # Scans all owned and shared repos
